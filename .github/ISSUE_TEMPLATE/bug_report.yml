name: Bug report
description: Report a reproducible playback or extension problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Netflix Auto Skip. Please redact account identifiers and any private Netflix data before submitting.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the Netflix playback state and the exact action that failed or happened unexpectedly.
      placeholder: |
        1. Open a show...
        2. Start playback...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Vivaldi 7.x, Edge 140...
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: 1.1.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Paste relevant errors only. Remove account, cookie, URL, or other private data.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
